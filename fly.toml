app = 'attic-server-fly'
primary_region = 'lax'
kill_signal = 'SIGINT'
kill_timeout = 60
swap_size_mb = 512

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 0
processes = ['app']

[[vm]]
size = 'shared-cpu-1x'
